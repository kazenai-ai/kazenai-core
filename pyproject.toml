[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kazenai"
version = "1.2.0"
description = "A hard spending limit for every customer's AI: the KazenAI core SDK checks each OpenAI and Anthropic call against its limit before it runs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Dhavan Shah", email = "founder@kazenai.com" }]
keywords = ["llm", "agents", "observability", "finops", "langchain"]

dependencies = [
  "kazen-event-schema>=0.6.6,<0.7",
  "httpx>=0.25",
  "pydantic>=2.6.0",
  "structlog>=24.1.0",
  "aiohttp>=3.9.0",
  "PyJWT>=2.8.0",
  # Verifies the signed price catalog Agent FinOps serves (Ed25519). Without it
  # the live catalog feed stays off. 50.0.0 is the first release with no known advisory.
  "cryptography>=50.0.0",
]

[project.optional-dependencies]
# Tested on OpenAI 1.109.1 and 2.48.0 and Anthropic 0.125.0.
openai = ["openai>=1.40,<3"]
anthropic = ["anthropic>=0.39,<1"]
providers = ["openai>=1.40,<3", "anthropic>=0.39,<1"]
# Optional OpenTelemetry; import works without these packages.
otel = [
  "opentelemetry-api>=1.45.1,<2",
  "opentelemetry-sdk>=1.45.1,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
]
# KazenAI services (FinOps, Lens): Ed25519 verification of Platform tokens.
server = ["PyJWT[crypto]>=2.15.1"]
# Optional image metadata inspection. Never raster-decodes.
images = ["pillow==13.0.0"]
# Framework pins for the LangChain / LangGraph / CrewAI adapters. Import works without these.
langchain = [
  "langchain==1.4.4",
  "langchain-core==1.6.9",
  "langchain-openai==1.7.0",
  "langchain-anthropic==1.7.5",
]
langgraph = [
  "langgraph==1.2.14",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langchain-core==1.6.9",
]
crewai = ["crewai==1.15.26"]
frameworks = [
  "langchain==1.4.4",
  "langchain-core==1.6.9",
  "langchain-openai==1.7.0",
  "langchain-anthropic==1.7.5",
  "langgraph==1.2.14",
  "langgraph-checkpoint-sqlite==3.1.1",
  "crewai==1.15.26",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "fastapi>=0.110",
  "httpx>=0.27",
  # Ed25519 verification in the default suite needs this beside PyJWT.
  "cryptography>=43",
  "openai>=1.40,<3",
  "anthropic>=0.39,<1",
  "opentelemetry-api>=1.45.1,<2",
  "opentelemetry-sdk>=1.45.1,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.urls]
"Homepage" = "https://kazenai.com"
"Documentation" = "https://docs.kazenai.com/"
"Repository" = "https://github.com/kazenai-ai/kazenai-core"
"Changelog" = "https://github.com/kazenai-ai/kazenai-core/releases"
"Bug Tracker" = "https://github.com/kazenai-ai/kazenai-core/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["kazenai*"]

[tool.coverage.run]
omit = [
  "kazenai/debug.py",
  # Framework and LiteLLM adapters are covered by the `frameworks` CI job, not
  # the default 80% package gate; adapter_contract stays measured.
  "kazenai/integrations/litellm_control.py",
  "kazenai/integrations/litellm_gateway.py",
  "kazenai/integrations/langchain.py",
  "kazenai/integrations/langgraph.py",
  "kazenai/integrations/crewai.py",
  # Streaming provider proxies are covered by the official-SDK streaming suites; the
  # default package gate measures lifecycle + monitor + shared streaming helpers.
  "kazenai/streaming/openai.py",
  "kazenai/streaming/anthropic.py",
  "kazenai/streaming/proxy.py",
  # Async provider dispatch twin of the streaming proxies above — measured by
  # the async provider suites and their own coverage gate, not the default 80% package gate.
  "kazenai/_async_provider.py",
  "kazenai/retry_queue.py",
  # In-tree mirror of the shared principal rules; covered by the principal contract tests
  "kazenai/auth/_principal_impl.py",
]

[tool.coverage.report]
fail_under = 80

[tool.pytest.ini_options]
markers = [
  "live: paid OpenAI/Anthropic network smoke (requires KAZENAI_LIVE_PROVIDER_SMOKE=1)",
]
testpaths = ["tests"]
addopts = "--cov=kazenai --cov-report=term-missing -m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep the lint gate stable across Ruff versions.
select = ["E4", "E7", "E9", "F"]
