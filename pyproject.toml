[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kazenai"  # Matches your README installation instructions
version = "1.1.2"
description = "KazenAI core SDK: monitor() budget and loop enforcement for OpenAI/Anthropic (Control-certified sync + async + streaming)"
readme = "README.md"
requires-python = ">=3.10" # v4 TDD specifies 3.10+ for modern Typing/ContextVars
license = "Apache-2.0"
authors = [{ name = "KazenAI", email = "hello@kazenai.com" }]
keywords = ["llm", "agents", "observability", "finops", "langchain"]

dependencies = [
  "kazen-event-schema>=0.6.4,<0.7",
  "httpx>=0.25",
  "pydantic>=2.6.0",
  "structlog>=24.1.0",
  "aiohttp>=3.9.0",
  "pydantic-settings>=2.1.0", # Added: Necessary for your config.py logic
  "PyJWT>=2.8.0",
]

[project.optional-dependencies]
# Certified lines: OpenAI 1.109.1 baseline + OpenAI 2.48.0; Anthropic 0.125.0.
# Install range keeps 1.40+ for apps; release evidence pins the certified pair.
openai = ["openai>=1.40,<3"]
anthropic = ["anthropic>=0.39,<1"]
providers = ["openai>=1.40,<3", "anthropic>=0.39,<1"]
# P7: optional OTel — ordinary import works without these packages.
otel = [
  "opentelemetry-api>=1.45.1,<2",
  "opentelemetry-sdk>=1.45.1,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
]
# P8: modern framework pins (selected in P0). Ordinary import works without these.
langchain = [
  "langchain==1.4.4",
  "langchain-core==1.6.9",
  "langchain-openai==1.7.0",
  "langchain-anthropic==1.7.5",
]
langgraph = [
  "langgraph==1.2.14",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langchain-core==1.6.9",
]
crewai = ["crewai==1.15.26"]
frameworks = [
  "langchain==1.4.4",
  "langchain-core==1.6.9",
  "langchain-openai==1.7.0",
  "langchain-anthropic==1.7.5",
  "langgraph==1.2.14",
  "langgraph-checkpoint-sqlite==3.1.1",
  "crewai==1.15.26",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "fastapi>=0.110",
  "httpx>=0.27",
  "openai>=1.40,<3",
  "anthropic>=0.39,<1",
  "opentelemetry-api>=1.45.1,<2",
  "opentelemetry-sdk>=1.45.1,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.urls]
"Homepage" = "https://kazenai.com"
"Documentation" = "https://docs.kazenai.com/"
"Repository" = "https://github.com/kazenai-ai/kazenai-core"
"Changelog" = "https://github.com/kazenai-ai/kazenai-core/releases"
"Bug Tracker" = "https://github.com/kazenai-ai/kazenai-core/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["kazenai*"]

[tool.coverage.run]
omit = [
  "kazenai/middleware/*",
  "kazenai/debug.py",
  # P9: framework adapters are measured by a dedicated integrations coverage gate
  # (see scripts/final1b_final_p9_release_verify.py). Keep framework + LiteLLM
  # helpers out of the default 80% package gate; adapter_contract stays measured.
  "kazenai/integrations/litellm_control.py",
  "kazenai/integrations/langchain.py",
  "kazenai/integrations/langgraph.py",
  "kazenai/integrations/crewai.py",
  # Streaming provider proxies are covered by Train-B / official-SDK suites; the
  # default package gate measures lifecycle + monitor + shared streaming helpers.
  "kazenai/streaming/openai.py",
  "kazenai/streaming/anthropic.py",
  "kazenai/streaming/proxy.py",
  # Async provider dispatch twin of the streaming proxies above — measured by
  # Train-B / p5 async provider suites, not the default 80% package gate.
  "kazenai/_async_provider.py",
  "kazenai/retry_queue.py",
  # LF-05 in-tree contracts mirror; exercised via re-export / contracts suite
  "kazenai/auth/_principal_impl.py",
]

[tool.coverage.report]
fail_under = 80

[tool.pytest.ini_options]
markers = [
  "live: paid OpenAI/Anthropic network smoke (requires KAZENAI_LIVE_PROVIDER_SMOKE=1)",
]
testpaths = ["tests"]
addopts = "--cov=kazenai --cov-report=term-missing -m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep the release gate stable across Ruff versions. Broader legacy style
# cleanup belongs in a dedicated repository-wide change, not this streaming
# correctness release.
select = ["E4", "E7", "E9", "F"]
