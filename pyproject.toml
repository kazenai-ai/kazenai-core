[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kazenai"  # Matches your README installation instructions
version = "1.0.1"
description = "KazenAI SDK - agent monitoring, FinOps, and event instrumentation"
readme = "README.md"
requires-python = ">=3.10" # v4 TDD specifies 3.10+ for modern Typing/ContextVars
license = { text = "Apache-2.0" }
authors = [{ name = "KazenAI", email = "hello@kazenai.com" }]
keywords = ["llm", "agents", "observability", "finops", "langchain"]

dependencies = [
  "kazen-event-schema>=0.6.0,<0.7",
  "httpx>=0.25",
  "pydantic>=2.6.0",
  "structlog>=24.1.0",
  "aiohttp>=3.9.0",
  "pydantic-settings>=2.1.0", # Added: Necessary for your config.py logic
  "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "fastapi>=0.110",
  "httpx>=0.27",
]

[project.urls]
"Homepage" = "https://kazenai.com"
"Repository" = "https://github.com/kazenai-ai/kazenai-core"

[tool.setuptools.packages.find]
where = ["."]
include = ["kazenai*"]

[tool.coverage.run]
omit = [
  "kazenai/middleware/*",
  "kazenai/debug.py",
  "kazenai/integrations/*",
  "kazenai/retry_queue.py",
  # LF-05 in-tree contracts mirror; exercised via re-export / contracts suite
  "kazenai/auth/_principal_impl.py",
]

[tool.coverage.report]
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=kazenai --cov-report=term-missing"
