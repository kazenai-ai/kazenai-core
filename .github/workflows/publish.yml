# PyPI Trusted Publishing (OIDC). Configure pending/trusted publisher at:
#   https://pypi.org/manage/account/publishing/
#   Owner: kazenai-ai  Repo: kazenai-core  Workflow: publish.yml  Environment: pypi
#   PyPI project name: kazenai
#
# The bytes that were scanned and approved are the bytes that are published:
#   build   builds the wheel + sdist ONCE, records sha256, generates SBOMs and runs
#           the licence gate on those exact files, and uploads them as one artifact.
#   publish runs in the protected `pypi` environment (required reviewer: the
#           founder approves after reading the build job's licence report), re-checks
#           the hashes and uploads the same files. Nothing is rebuilt.
#   verify  polls PyPI until it serves the release and fails unless every
#           PyPI-reported sha256 equals the recorded one.
# Actions are pinned by commit SHA.
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install hash-locked build + licence tooling and Syft
        run: |
          python -m pip install --require-hashes -r scripts/license-tools.lock
          curl -sSfL -o /tmp/syft.tgz https://github.com/anchore/syft/releases/download/v1.54.1/syft_1.54.1_linux_amd64.tar.gz
          echo "c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47  /tmp/syft.tgz" | sha256sum -c -
          tar -xzf /tmp/syft.tgz -C /tmp syft

      - name: Build sdist and wheel (once)
        run: python -m build

      - name: Hash, SBOM and licence gate for these exact files
        run: |
          (cd dist && sha256sum -- * > ../dist.sha256)
          cat dist.sha256
          mkdir -p sbom unpacked
          for w in dist/*.whl; do python -m zipfile -e "$w" "unpacked/$(basename "$w" .whl)"; done
          /tmp/syft scan dir:unpacked -q -o syft-json=sbom/wheel.syft.json -o cyclonedx-json@1.5=sbom/wheel.cdx.json
          for s in dist/*.tar.gz; do /tmp/syft scan "file:$s" -q -o syft-json=sbom/sdist.syft.json -o cyclonedx-json@1.5=sbom/sdist.cdx.json; done
          python scripts/license_policy.py check --syft sbom/wheel.syft.json --syft sbom/sdist.syft.json --context library --report sbom/licence-report.json
          python scripts/license_policy.py validate sbom/*.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/
            dist.sha256
            sbom/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.ref_name }}
          path: release

      - name: Re-check the approved files' hashes
        run: cd release/dist && sha256sum -c ../dist.sha256

      - name: Publish the approved files to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (GHSA-5xjx-3w67-w9x9)
        with:
          packages-dir: release/dist/

  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.ref_name }}
          path: release

      - name: PyPI must serve exactly the approved bytes
        run: |
          python3 - <<'PY'
          import json, re, time, urllib.request
          want = {}
          for line in open("release/dist.sha256"):
              digest, name = line.split()
              want[name.lstrip("*")] = digest
          name = next(iter(want))
          project, version = re.match(r"^([A-Za-z0-9_.]+?)-(\d[^-]*?)(?:-py3|\.tar\.gz)", name).groups()
          url = f"https://pypi.org/pypi/{project}/{version}/json"
          for attempt in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=30) as resp:
                      files = {u["filename"]: u["digests"]["sha256"] for u in json.load(resp)["urls"]}
                  if set(want) <= set(files):
                      break
              except Exception as exc:
                  print("waiting for PyPI:", exc)
              time.sleep(15)
          else:
              raise SystemExit(f"PyPI never served {sorted(want)} at {url}")
          bad = {f: (want[f], files[f]) for f in want if files[f] != want[f]}
          if bad:
              raise SystemExit(f"PyPI digests differ from the approved files: {bad}")
          print("PyPI serves the approved bytes:", json.dumps(want, indent=2))
          PY
