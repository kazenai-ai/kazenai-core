name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KAZENAI_TIER_MISMATCH_MULTIPLIER: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Contact email guard (founder@kazenai.com only)
        run: |
          if git grep -nIE '[A-Za-z0-9._%+-]+@kazenai\.com' | grep -v 'founder@kazenai\.com'; then
            echo "Use founder@kazenai.com as the only public contact address."
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --upgrade pip
      # kazen-event-schema>=0.6.6 resolves from PyPI via pyproject.toml.
      - run: pip install -e ".[dev]"
      - name: Lint streaming and budget modules
        run: >-
          ruff check kazenai/streaming kazenai/monitor.py kazenai/_dispatch_gate.py kazenai/spine/guard.py kazenai/enforcement.py
          tests/test_dispatch_gate.py
          kazenai/model_pricing.py kazenai/cost_engine.py kazenai/pricing_policy.py
          kazenai/budget.py kazenai/provider_errors.py tests/test_shared_budget.py
          tests/test_provider_rejection_settlement.py tests/test_live_found_regressions.py
          tests/test_pricing_single_source.py tests/test_streaming_contract.py
          tests/test_streaming_hardening.py tests/test_official_sdk_contract.py
      - name: Type-check provider-neutral streaming lifecycle
        run: mypy kazenai/streaming kazenai/budget.py kazenai/provider_errors.py --ignore-missing-imports --follow-imports=skip
      # Coverage bar matches pyproject.toml [tool.coverage.report] fail_under=80.
      - run: pytest tests/ -q --cov=kazenai --cov-report=term-missing --cov-fail-under=80
      - name: Enforce async provider behavioral coverage
        run: python scripts/coverage_async_provider_gate.py
      - name: CrewAI 1.15.26 Control certification (real crews, coverage gate)
        env:
          CREWAI_DISABLE_TELEMETRY: "true"
          OTEL_SDK_DISABLED: "true"
          KAZENAI_REQUIRE_CREWAI: "1"
        run: |
          pip install -e ".[crewai]"
          pytest -q -o addopts="" \
            tests/test_crewai_control_certification.py \
            tests/test_crewai_event_ownership.py \
            tests/test_structured_output_and_crewai_bind.py \
            --cov=kazenai.integrations.crewai --cov-config=/dev/null --cov-fail-under=75
      - name: Export KazenEvent schema and fail on drift
        run: |
          python scripts/export_kazenevent_schema.py
          git diff --exit-code -- contracts/kazenevent.schema.v1.json

  # LangChain / LangGraph adapters on the pinned framework versions. The test job
  # above installs only `.[dev]`, so these files skip there; here they must run.
  frameworks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev,langchain,langgraph,crewai]" pyflakes
      - name: Framework adapter tests (must not skip for a missing framework)
        run: |
          set -o pipefail
          pytest -q -rs --no-cov \
            tests/test_framework_adapters.py \
            tests/test_real_frameworks.py \
            tests/test_framework_control_cells.py \
            tests/test_langgraph_async_sqlite_restart.py \
            tests/test_langchain_anthropic_and_multi_client.py \
            tests/test_shared_budget.py \
            tests/test_live_found_regressions.py \
            tests/test_no_undefined_names.py | tee frameworks.log
          if grep -E "SKIPPED.*(langchain|langgraph|crewai|pyflakes)" frameworks.log; then
            echo "Framework tests were skipped; the pinned frameworks must be installed."
            exit 1
          fi

  licence-gate:
    # Licence gate + CycloneDX SBOM (scripts/license_policy.py, licence-gate/license-policy.toml,
    # licence-gate/license-exceptions.toml). Blocking: a denied licence, an invalid SBOM or stale
    # generated notices fail the build. Actions are pinned by commit SHA.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install hash-locked licence tooling and Syft
        run: |
          python -m pip install --require-hashes -r scripts/license-tools.lock
          curl -sSfL -o /tmp/syft.tgz https://github.com/anchore/syft/releases/download/v1.54.1/syft_1.54.1_linux_amd64.tar.gz
          echo "c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47  /tmp/syft.tgz" | sha256sum -c -
          tar -xzf /tmp/syft.tgz -C /tmp syft
      - name: Build wheel and sdist (the exact files that would be published)
        run: python -m build
      - name: SBOM and licence gate for the wheel and sdist
        run: |
          mkdir -p sbom unpacked
          for w in dist/*.whl; do python -m zipfile -e "$w" "unpacked/$(basename "$w" .whl)"; done
          /tmp/syft scan dir:unpacked -q -o syft-json=sbom/wheel.syft.json -o cyclonedx-json@1.5=sbom/wheel.cdx.json
          for s in dist/*.tar.gz; do /tmp/syft scan "file:$s" -q -o syft-json=sbom/sdist.syft.json -o cyclonedx-json@1.5=sbom/sdist.cdx.json; done
          python scripts/license_policy.py check --syft sbom/wheel.syft.json --syft sbom/sdist.syft.json --context library --report sbom/licence-report.json
          sha256sum dist/* | tee sbom/dist.sha256
      - name: Validate SBOMs (CycloneDX schema)
        run: python scripts/license_policy.py validate sbom/*.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
