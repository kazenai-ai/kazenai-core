name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Neither dependency is on PyPI yet; install pinned vendored wheels first.
      - name: Install vendored unpublished deps
        run: |
          pip install --upgrade pip
          pip install ./vendor/kazen_event_schema-0.6.0-py3-none-any.whl
          pip install ./vendor/kazenai_contracts-0.1.0-py3-none-any.whl
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -q --cov=kazenai --cov-report=term-missing --cov-fail-under=90
      - run: python scripts/export_kazenevent_schema.py
