name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --upgrade pip
      # kazen-event-schema>=0.6.4 resolves from PyPI via pyproject.toml.
      - run: pip install -e ".[dev]"
      - name: Lint streaming and budget modules
        run: >-
          ruff check kazenai/streaming kazenai/monitor.py kazenai/spine/guard.py kazenai/enforcement.py
          kazenai/model_pricing.py kazenai/cost_engine.py kazenai/pricing_policy.py
          kazenai/budget.py kazenai/provider_errors.py tests/test_shared_budget.py
          tests/test_provider_rejection_settlement.py tests/test_live_found_regressions.py
          tests/test_pricing_single_source.py tests/test_train_b_streaming.py
          tests/test_train_b_streaming_hardening.py tests/test_train_b_official_sdks.py
      - name: Type-check provider-neutral streaming lifecycle
        run: mypy kazenai/streaming kazenai/budget.py kazenai/provider_errors.py --ignore-missing-imports --follow-imports=skip
      # Coverage bar matches pyproject.toml [tool.coverage.report] fail_under=80.
      - run: pytest tests/ -q --cov=kazenai --cov-report=term-missing --cov-fail-under=80
      - name: Enforce async provider behavioral coverage
        run: python scripts/coverage_async_provider_gate.py
      - name: CrewAI ownership routing on the real 1.15.26 event bus
        env:
          CREWAI_DISABLE_TELEMETRY: "true"
          OTEL_SDK_DISABLED: "true"
          KAZENAI_REQUIRE_CREWAI: "1"
        run: |
          pip install "crewai==1.15.26"
          pytest tests/test_crewai_event_ownership.py tests/test_structured_output_and_crewai_bind.py -q --no-cov
      - name: Export KazenEvent schema and fail on drift
        run: |
          python scripts/export_kazenevent_schema.py
          git diff --exit-code -- contracts/kazenevent.schema.v1.json

  # LangChain / LangGraph adapters on the pinned framework versions. The test job
  # above installs only `.[dev]`, so these files skip there; here they must run.
  frameworks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev,langchain,langgraph]" pyflakes
      - name: Framework adapter tests (must not skip for a missing framework)
        run: |
          set -o pipefail
          pytest -q -rs --no-cov \
            tests/test_framework_adapters.py \
            tests/test_real_frameworks.py \
            tests/test_framework_control_cells.py \
            tests/test_langgraph_async_sqlite_restart.py \
            tests/test_langchain_anthropic_and_multi_client.py \
            tests/test_shared_budget.py \
            tests/test_live_found_regressions.py \
            tests/test_no_undefined_names.py | tee frameworks.log
          if grep -E "SKIPPED.*(langchain|langgraph|pyflakes)" frameworks.log; then
            echo "Framework tests were skipped; the pinned frameworks must be installed."
            exit 1
          fi
